name: ci

# Pull requests, and main after each merge (or by hand). Not on every branch
# push: a pull request's branch would run everything twice, once for the push
# and once for the pull request. Tags have no run of their own: a release tag
# must be a commit of main (images.yml checks), which this ran on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit on a pull request cancels the run for the one before; on main
# every commit's run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go installs go.mod's toolchain line (release binaries are built
      # with it), the images build on the Dockerfile's Go image: both must be
      # the same Go release, so a Dependabot update of the image needs the
      # toolchain line too.
      - name: one Go release
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          image=$(sed -n 's/^FROM .*golang:\([0-9.]*\)@.*/go\1/p' Dockerfile)
          have=$(go env GOVERSION)
          echo "go.mod toolchain: ${want:-none}, Dockerfile: ${image:-no golang:<version>@<digest>}, installed: $have"
          test -n "$want" && test "$want" = "$image" && test "$have" = "$want"
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./cmd/hopcorder

  lint:
    # golangci-lint includes go vet, with every build tag.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags=rawsock,clickhouse,grafana

  vuln:
    # Known vulnerabilities (vuln.go.dev) in the modules and in the Go release
    # of go.mod's toolchain line, which builds the release binaries. The
    # pinned govulncheck runs with `go run`, outside go.mod; update it by hand.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  rawsock:
    # GitHub-hosted runners grant passwordless sudo, so the raw-socket tests can
    # run with CAP_NET_RAW (and CAP_SYS_ADMIN for the netns topology test).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build test binary
        run: go test -c -tags rawsock -race -o probe.test ./internal/probe
      - name: run with capabilities
        run: sudo ./probe.test -test.v -test.count=1
      # The spool on a real full file system (a tmpfs it mounts), which the
      # unprivileged test job skips.
      - name: spool on a full tmpfs
        run: |
          go test -c -race -o spool.test ./internal/spool
          sudo ./spool.test -test.run '^TestFullTmpfs$' -test.v -test.count=1 | tee spool.out
          grep -q -- '--- PASS: TestFullTmpfs ' spool.out

  clickhouse:
    # Server tests against a real ClickHouse: migrations, every query, and
    # the agent -> server -> ClickHouse path.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
          # Not UTC, as on a host installed from packages: the server sends
          # times as UTC and must say so in every query (review round five).
          TZ: America/New_York
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test against ClickHouse
        env:
          HOPCORDER_CLICKHOUSE_URL: http://127.0.0.1:8123
        run: go test -tags clickhouse -race -count=1 ./internal/server/... ./cmd/hopcorder/...

  grafana:
    # The docker-compose try-out stack built from this commit, with the real
    # Grafana ClickHouse plugin: records through the server's ingest API, then
    # every dashboard query through Grafana and the provisioned data source.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Grafana's ClickHouse user leaves no files
        # sqlite() creates its file under user_files_path before it checks
        # the grant, and a CapnProto or Protobuf output without a schema
        # leaves its generated schema file under format_schema_path when
        # generating it fails; compose points both paths at an empty
        # directory the clickhouse user cannot write
        # (compose/clickhouse-config.xml), and the Grafana user's profile
        # turns schema generation off (compose/clickhouse-init.sql).
        # formatRow() formats in the server whatever the protocol (FORMAT
        # in clickhouse-client's native protocol is the client's).
        run: |
          dc() { docker compose -f deploy/docker-compose.yml "$@"; }
          as() { dc exec -T clickhouse clickhouse-client --user "$1" --password "$1" --query "$2" 2>&1; }
          if out=$(as grafana "SELECT * FROM sqlite('probe.db','t')"); then
            echo "the Grafana user may use sqlite(): $out"; exit 1
          fi
          for q in "SELECT formatRow('CapnProto', 1)" "SELECT formatRow('Protobuf', 1)"; do
            if out=$(as grafana "$q") || ! grep -q 'requires a schema' <<<"$out"; then
              echo "the Grafana user may generate a schema ($q): $out"; exit 1
            fi
            # The server's user may generate one: format_schema_path
            # refuses the file.
            if out=$(as hopcorder "$q") || ! grep -q 'Cannot open file /srv/' <<<"$out"; then
              echo "a schema file was not refused ($q): $out"; exit 1
            fi
          done
          dc exec -T clickhouse sh -c 'test -z "$(ls -A /srv)" && test ! -e /var/lib/clickhouse/user_files/probe.db &&
            test -z "$(ls -A /var/lib/clickhouse/format_schemas 2>/dev/null)"' ||
            { echo "a refused query left a file behind"; exit 1; }
      - name: Grafana's ClickHouse user cannot change grants
        # GRANT CURRENT GRANTS ... WITH REPLACE OPTION ran for the
        # read-only user and took the grantee's privileges for good; the
        # user is created with GRANTEES NONE (compose/clickhouse-init.sql).
        run: |
          as() { docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client --user "$1" --password "$1" --query "$2" 2>&1; }
          for grantee in grafana hopcorder; do
            if out=$(as grafana "GRANT CURRENT GRANTS ON *.* TO $grantee WITH REPLACE OPTION"); then
              echo "the Grafana user may replace $grantee's grants"; exit 1
            fi
            grep -q 'not allowed as grantee' <<<"$out" || { echo "unexpected refusal: $out"; exit 1; }
          done
          test "$(as grafana "SELECT count() > 0 FROM hopcorder.cycles")" = 1 || { echo "the Grafana user lost its grants"; exit 1; }
      - name: ClickHouse's logs leave room for the data
        # One failing query of Grafana's user wrote its exception message,
        # up to its memory limit, into query_log and text_log: the system
        # logs are on a disk of their own (compose/clickhouse-config.xml)
        # that keeps a quarter of the file system free, with a TTL.
        run: |
          q() { docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client \
            --user hopcorder --password hopcorder --query "$1"; }
          # A refused BACKUP still logs its destination (backup_log), and a
          # traced query its exception (opentelemetry_span_log, which is off).
          docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client --user grafana \
            --password grafana --query "BACKUP TABLE hopcorder.cycles TO Disk('default', 'probe')" 2>/dev/null && exit 1
          docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client --user grafana \
            --password grafana --opentelemetry-traceparent 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01 \
            --query "SELECT 1" >/dev/null
          q "SYSTEM FLUSH LOGS"
          test "$(q "SELECT keep_free_space * 4 >= total_space * 0.99 FROM system.disks WHERE name = 'system_logs'")" = 1 ||
            { echo "no system_logs disk keeping a quarter free"; exit 1; }
          # Every system table on disk: logs a future ClickHouse turns on
          # by default are caught too.
          bad=$(q "SELECT name FROM system.tables WHERE database = 'system' AND engine LIKE '%MergeTree'
            AND (storage_policy != 'system_logs' OR engine_full NOT LIKE '%TTL%')")
          test -z "$bad" || { echo "system tables off the system_logs disk or without a TTL: $bad"; exit 1; }
          test "$(q "EXISTS system.opentelemetry_span_log")" = 0 || { echo "opentelemetry_span_log is on"; exit 1; }
          # ClickHouse's own log files (on the host's disk) do not repeat a
          # failing query's message: 4 MB, written about five times before.
          logs() { docker compose -f deploy/docker-compose.yml exec -T clickhouse sh -c 'du -cb /var/log/clickhouse-server/* | tail -1 | cut -f1'; }
          before=$(logs)
          docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client --user grafana --password grafana \
            --query "SELECT 1 WHERE throwIf(1, concat('probe-', arrayStringConcat(arrayMap(x -> reinterpretAsString(sipHash128(x)), range(250000)))))" \
            >/dev/null 2>&1 && exit 1
          sleep 1
          grew=$(( $(logs) - before ))
          [ "$grew" -lt 1000000 ] || { echo "ClickHouse's log files grew $grew bytes for one failing query"; exit 1; }
          # Nor a host name passed to hasColumnInTable(), up to 1 MB, which
          # DNSResolver logged four times (and on each retry of the DNS
          # cache) and Cluster once more.
          docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client --user grafana --password grafana \
            --query "SELECT hasColumnInTable(concat('dnsprobe', repeat('a', 100000), '.invalid:9000'), 'a', 'b', 'c')" \
            >/dev/null 2>&1 && exit 1
          sleep 1
          if docker compose -f deploy/docker-compose.yml exec -T clickhouse sh -c \
            'grep -a -E "(DNSResolver|Cluster): .*dnsprobe" /var/log/clickhouse-server/*' | grep -q .; then
            echo "ClickHouse's DNSResolver or Cluster logger repeats a query's host name"; exit 1
          fi
          # No MySQL (9004), PostgreSQL (9005) or interserver (9009)
          # listener: the PostgreSQL handlers also log a failing query's
          # whole message. (Docker's DNS listens in the container too.)
          ports=$(docker compose -f deploy/docker-compose.yml exec -T clickhouse sh -c \
            'awk "\$4 == \"0A\" { print \$2 }" /proc/net/tcp /proc/net/tcp6 2>/dev/null')
          grep -q ':1FBB$' <<<"$ports" || { echo "no listener on 8123 found: $ports"; exit 1; }
          if grep -qE ':(232C|232D|2331)$' <<<"$ports"; then
            echo "ClickHouse listens on 9004, 9005 or 9009 (hex): $ports"; exit 1
          fi
      - name: ClickHouse cannot connect out
        # hasColumnInTable('host:port', ...) makes ClickHouse open a
        # connection for Grafana's read-only user, which no grant covers;
        # compose keeps ClickHouse on an internal network. The runner has a
        # route to 1.1.1.1, so without that network the attempt would go
        # out (and time out or connect) rather than fail at once.
        run: |
          out=$(docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client --user grafana \
            --password grafana --query "SELECT hasColumnInTable('1.1.1.1:9000', 'a', 'b', 'c')" 2>&1) && exit 1
          grep -q 'Network is unreachable' <<<"$out" || { echo "ClickHouse may connect out: $out"; exit 1; }
      - name: dashboards through Grafana
        env:
          HOPCORDER_SERVER_URL: http://127.0.0.1:8080
          HOPCORDER_GRAFANA_URL: http://localhost:3000
        run: go test -tags grafana -count=1 -v ./dashboards/
      - name: stack logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

  ui:
    # The embedded UI: type check, unit tests, the committed build in
    # internal/ui/dist matches the source, and the browser tests against a
    # real server and ClickHouse.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: the committed build is current
        run: |
          npm run build
          git status --porcelain -- ../internal/ui/dist
          test -z "$(git status --porcelain -- ../internal/ui/dist)"
      - name: start the server
        working-directory: .
        run: |
          go build -o hopcorder ./cmd/hopcorder
          cat > server-e2e.yaml <<EOF
          listen: 127.0.0.1:8080
          clickhouse: {url: http://127.0.0.1:8123, database: hopcorder_e2e}
          enrich:
            rdns: {enabled: false}
            asn: {url: "", file: ui/e2e/asn.tsv}
          EOF
          ./hopcorder server --config server-e2e.yaml > server-e2e.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8080/readyz && exit 0; sleep 1; done
          cat server-e2e.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: browser tests
        env:
          HOPCORDER_URL: http://127.0.0.1:8080/
        run: npm run e2e
      - name: server log
        if: always()
        working-directory: .
        run: cat server-e2e.log || true

  helm:
    # The Helm charts: lint, then install the server and the agent (in both
    # modes) into a kind cluster, with images built from this commit, and
    # check that every agent's records arrive.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      # A released chart runs its images by digest (image.digest, which
      # scripts/release-build.sh writes into the packages and checks), so
      # moving the tag does not change what it runs; from a checkout, by
      # tag. A tag of your own replaces both.
      - name: image references
        run: |
          d=sha256:$(printf '%064d' 0 | tr 0 d)
          for chart in hopcorder-server hopcorder-agent hopcorder-agent:daemonset; do
            c=${chart%:*} set=()
            if [ "$c" = hopcorder-agent ]; then set=(--set 'config.targets[0].host=example.net'); fi
            if [ "$chart" != "$c" ]; then set+=(--set mode=daemonset); fi
            app=$(helm show chart "deploy/helm/$c" | sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
            image() { helm template a "deploy/helm/$c" "${set[@]}" "$@" | sed -n 's/^ *image: //p'; }
            expect() {
              local want=$1 got
              shift
              got=$(image "$@")
              if [ "$got" != "$want" ]; then
                echo "$chart $*: image $got, want $want"; exit 1
              fi
            }
            expect "\"ghcr.io/saremox/$c:$app\""
            expect "\"ghcr.io/saremox/$c:$app@$d\"" --set "image.digest=$d"
            expect "\"ghcr.io/saremox/$c:main\"" --set "image.digest=$d" --set image.tag=main
            expect "\"ghcr.io/saremox/$c:1.2.3@$d\"" --set "image.tag=1.2.3@$d"
            if helm template a "deploy/helm/$c" "${set[@]}" --set image.digest=sha256:abc >/dev/null 2>&1; then
              echo "$chart: accepted image.digest=sha256:abc"; exit 1
            fi
          done
      - name: lint
        run: |
          helm lint --strict deploy/helm/hopcorder-server
          helm lint --strict deploy/helm/hopcorder-server -f deploy/helm/ci/server-netpol-values.yaml
          helm lint --strict deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml
          helm template a deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml \
            --set clickhouse.passwordSecret.name=ch \
            --set clickhouse.deploy.readOnlyUser.passwordSecret.name=ro >/dev/null
          helm lint --strict deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-values.yaml
          helm lint --strict deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-ds-values.yaml
          helm lint --strict deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-values.yaml -f deploy/helm/ci/agent-netpol-values.yaml
          # No liveness (or other) probe on the agent: the metrics listener
          # holds at most 64 connections, so a probe on it lets anyone who
          # can reach the port have the agent restarted. The port stays.
          for v in agent-values.yaml agent-ds-values.yaml; do
            out=$(helm template a deploy/helm/hopcorder-agent -f "deploy/helm/ci/$v")
            if grep -Eq '(liveness|readiness|startup)Probe' <<<"$out"; then
              echo "the agent chart renders a probe with $v"; exit 1
            fi
            grep -q 'containerPort: ' <<<"$out"
          done
          helm template a deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-values.yaml \
            --set networkPolicy.enabled=true --set metrics.listenAddress=127.0.0.1 | grep -q 'ingress: \[\]'
          helm template a deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-values.yaml \
            --set server.basicAuth.username=agent --set server.basicAuth.passwordSecret.name=ba \
            --set server.tls.secretName=mtls --set server.tls.caKey=ca.crt \
            --set config.outputs.http.headers.X-Tenant=lab >/dev/null
          # The charts refuse what would put a credential into a ConfigMap
          # (readable with the built-in view role), and a NetworkPolicy
          # without peers.
          refused() {
            if helm template a "$@" >/dev/null 2>&1; then
              echo "accepted: $*"; exit 1
            fi
          }
          agent=(deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-values.yaml)
          refused "${agent[@]}" --set config.outputs.http.bearer_token=x
          refused "${agent[@]}" --set server.url=https://agent:pw@hopcorder.example.net
          for h in Authorization authorization Proxy-Authorization Cookie X-Api-Key x-auth-token Private-Token X-Vault-Token \
            Authentication X-Jwt Bearer X-Access-Token X-Access-Tokens X-AccessToken X-Amz-Security-Token; do
            refused "${agent[@]}" --set "config.outputs.http.headers.$h=x"
          done
          for h in X-Tenant X-Scope-OrgID X-Request-Source; do
            helm template a "${agent[@]}" --set "config.outputs.http.headers.$h=x" >/dev/null
          done
          # The agent's NetworkPolicy needs peers, and does nothing for
          # hostNetwork pods.
          refused "${agent[@]}" --set networkPolicy.enabled=true
          refused deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-ds-values.yaml -f deploy/helm/ci/agent-netpol-values.yaml
          # The spool fits its volume (review, round six): its file grows
          # to max_bytes, by default 75% of persistence.size (at most the
          # agent's 1GiB); more than 90% is refused. The DaemonSet's spool
          # is on the node, with the agent's default.
          spool() { helm template a "$@" --show-only templates/configmap.yaml | sed -n 's/^ *max_bytes: //p'; }
          test "$(spool "${agent[@]}")" = 768MiB
          test "$(spool "${agent[@]}" --set persistence.size=10Gi)" = 1024MiB
          test "$(spool "${agent[@]}" --set persistence.size=2Gi --set config.spool.max_bytes=1GiB)" = 1GiB
          test "$(spool "${agent[@]}" --set config.spool.max_bytes=900MiB)" = 900MiB
          test -z "$(spool deploy/helm/hopcorder-agent -f deploy/helm/ci/agent-ds-values.yaml)"
          # Values carried from the earlier chart (helm upgrade
          # --reuse-values, a copied values file) hold its default
          # max_bytes: 1GiB: refused, with a message that says how to drop
          # it, which works.
          old="${RUNNER_TEMP:-/tmp}/old-spool-values.yaml"
          printf 'config:\n  spool:\n    max_bytes: 1GiB\n' > "$old"
          if out=$(helm template a "${agent[@]}" -f "$old" 2>&1); then
            echo "carried max_bytes: 1GiB was accepted"; exit 1
          fi
          grep -q -- '--set config.spool.max_bytes=null' <<<"$out"
          test "$(spool "${agent[@]}" -f "$old" --set config.spool.max_bytes=null)" = 768MiB
          for v in config.spool.max_bytes=1GiB config.spool.max_bytes=1073741824 config.spool.max_bytes=1000MiB \
            config.spool.max_bytes=512KiB config.spool.max_bytes=lots persistence.size=1Gb persistence.size=1Mi; do
            refused "${agent[@]}" --set "$v"
          done
          refused deploy/helm/hopcorder-server --set config.clickhouse.password=x
          refused deploy/helm/hopcorder-server --set networkPolicy.enabled=true
          # Names that go into the bundled ClickHouse's XML configuration.
          refused deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --set clickhouse.deploy.user=a-b
          refused deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --set 'clickhouse.deploy.readOnlyUser.name=x</y'
          refused deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --set 'config.clickhouse.database=x;y'
          # DNS rebinding: the server answers the localhost names (kubectl
          # port-forward), the Service's names and the ingress hosts, or
          # what config.allowed_hosts says; names it cannot know must be
          # listed (smoke.sh checks a foreign Host gets 421).
          hosts() { helm template a deploy/helm/hopcorder-server -n mon --show-only templates/configmap.yaml "$@" |
            sed -n '/^    allowed_hosts:/,/^    [a-z]/p'; }
          ing=(--set ingress.enabled=true) # values.yaml's example host, hopcorder.example.net
          for h in localhost 127.0.0.1 ::1 a-hopcorder-server a-hopcorder-server.mon a-hopcorder-server.mon.svc \
            a-hopcorder-server.mon.svc.cluster.local hopcorder.example.net extra.example; do
            hosts "${ing[@]}" --set 'allowedHosts={extra.example}' | grep -qxF -- "    - $h" || { echo "allowed_hosts lacks $h"; exit 1; }
          done
          test "$(hosts --set 'allowedHosts={*}' | grep -c -- '^    - ')" = 1
          test "$(hosts --set 'config.allowed_hosts={only.example}' | grep -- '^    - ')" = "    - only.example"
          refused deploy/helm/hopcorder-server --set service.type=LoadBalancer
          refused deploy/helm/hopcorder-server --set service.type=NodePort
          refused deploy/helm/hopcorder-server "${ing[@]}" --set-json 'ingress.hosts=[{"host":"","paths":[{"path":"/","pathType":"Prefix"}]}]'
          refused deploy/helm/hopcorder-server --set 'allowedHosts={hopcorder.example.net:8080}'
          helm template a deploy/helm/hopcorder-server --set service.type=LoadBalancer --set 'allowedHosts={192.0.2.7}' >/dev/null
          # Entries are checked like the server checks them (it would refuse
          # its config at start, and the pod crash-loop instead of the
          # install failing), in allowedHosts and in config.allowed_hosts:
          # ports, malformed addresses, label rules and 253 characters at
          # most, and no wildcard on a top-level domain.
          l=$(printf 'a%.0s' {1..63})
          for h in 10.0.0.5:8080 cafe:443 :::: 1.2.3 256.0.0.1 '[::1]:8080' -a.example a..example "$l$l.example" \
            "$l.$l.$l.$l" '*.com' '*.' 'a.*.example'; do
            refused deploy/helm/hopcorder-server --set-json "allowedHosts=[\"$h\"]"
            refused deploy/helm/hopcorder-server --set-json "config.allowed_hosts=[\"$h\"]"
          done
          for h in 192.0.2.7 ::1 '[2001:db8::1]' ::ffff:192.0.2.1 '*.lab.example' hopcorder.example. a_b.example \
            "$l.$l.$l.${l:2}"; do
            helm template a deploy/helm/hopcorder-server --set-json "allowedHosts=[\"$h\"]" >/dev/null
            helm template a deploy/helm/hopcorder-server --set-json "config.allowed_hosts=[\"$h\"]" >/dev/null
          done
          # With the bundled ClickHouse, the read API's queries may use a
          # third of what it may use (80% of its memory limit), two at once.
          cfg() { helm template a deploy/helm/hopcorder-server --show-only templates/configmap.yaml "$@"; }
          test "$(cfg --set clickhouse.deploy.enabled=true | grep -A2 '^    query:')" = \
            "$(printf '    query:\n      max_concurrent: 2\n      max_memory_bytes: 273MiB')"
          cfg --set clickhouse.deploy.enabled=true --set config.query.max_concurrent=4 | grep -qx '      max_memory_bytes: 136MiB'
          cfg -f deploy/helm/ci/server-values.yaml | grep -qx '      max_memory_bytes: 136MiB'
          if cfg | grep -q 'max_memory_bytes'; then echo "a read budget without clickhouse.deploy"; exit 1; fi
          refused deploy/helm/hopcorder-server --set clickhouse.deploy.enabled=true --set clickhouse.deploy.resources.limits.memory=2e9
          # The bundled ClickHouse's read-only user: readonly = 1, under
          # which its queries may change max_execution_time (what the Grafana
          # plugin sends) and no other setting, the spill settings constant
          # in case readonly is lifted (smoke.sh runs them as the user), and
          # memory limits from the values, which by default leave the
          # server more than half of what ClickHouse may use.
          ch=$(helm template a deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --show-only templates/clickhouse.yaml)
          grep -qF '<readonly>1</readonly>' <<<"$ch" || { echo "readonly.xml: not readonly = 1"; exit 1; }
          grep -qF '<allow_hyperscan>0</allow_hyperscan>' <<<"$ch" || { echo "readonly.xml: hyperscan is allowed"; exit 1; }
          grep -qF '<user_files_path>/srv/</user_files_path>' <<<"$ch" || { echo "hopcorder.xml: user_files_path is writable"; exit 1; }
          grep -qF '<format_schema_path>/srv/</format_schema_path>' <<<"$ch" || { echo "hopcorder.xml: format_schema_path is writable"; exit 1; }
          # The system logs on a disk keeping a quarter of the volume free.
          grep -qF '<keep_free_space_ratio>0.25</keep_free_space_ratio>' <<<"$ch" || { echo "hopcorder.xml: no system_logs disk"; exit 1; }
          grep -qF '<opentelemetry_span_log remove="1"/>' <<<"$ch" || { echo "hopcorder.xml: opentelemetry_span_log is on"; exit 1; }
          # The loggers that repeat a failing query's message are off.
          for l in executeQuery DynamicQueryHandler HTTPHandler TCPHandler BackupsWorker DNSResolver Cluster; do
            grep -qF "<logger><name>$l</name><level>fatal</level></logger>" <<<"$ch" || { echo "hopcorder.xml: $l logs query messages"; exit 1; }
          done
          for l in mysql_port postgresql_port interserver_http_port; do
            grep -qF "<$l remove=\"1\"/>" <<<"$ch" || { echo "hopcorder.xml: $l is open"; exit 1; }
          done
          if [ "$(grep -c '<storage_policy>system_logs</storage_policy><ttl>' <<<"$ch")" != 17 ]; then
            echo "hopcorder.xml: a system log off the system_logs disk"; exit 1
          fi
          # ClickHouse may connect to nothing (hasColumnInTable() connects
          # out for the read-only user), and remote() resolves no host.
          np=$(awk '/^kind: NetworkPolicy/,/^---/' <<<"$ch")
          grep -qF 'policyTypes: [Ingress, Egress]' <<<"$np" && grep -qxF '  egress: []' <<<"$np" ||
            { echo "the ClickHouse NetworkPolicy lets ClickHouse connect out"; exit 1; }
          grep -qF '<remote_url_allow_hosts><host>localhost</host></remote_url_allow_hosts>' <<<"$ch" ||
            { echo "hopcorder.xml: remote() may resolve any host"; exit 1; }
          for s in format_capn_proto_use_autogenerated_schema format_protobuf_use_autogenerated_schema; do
            grep -qF "<$s>0</$s>" <<<"$ch" || { echo "readonly.xml: $s is on"; exit 1; }
          done
          if [ "$(grep -c '<changeable_in_readonly/>' <<<"$ch")" != 1 ] ||
            ! grep -qF '<max_execution_time><min>1</min><max>300</max><changeable_in_readonly/></max_execution_time>' <<<"$ch"; then
            echo "readonly.xml: a query may change settings other than max_execution_time (1 to 300 s)"; exit 1
          fi
          for s in readonly cancel_http_readonly_queries_on_client_close max_bytes_before_external_sort \
            max_bytes_ratio_before_external_sort max_bytes_before_external_group_by \
            max_bytes_ratio_before_external_group_by join_algorithm allow_hyperscan \
            format_capn_proto_use_autogenerated_schema format_protobuf_use_autogenerated_schema; do
            grep -qF "<$s><const/></$s>" <<<"$ch" || { echo "readonly.xml: $s is not constant"; exit 1; }
          done
          for s in '<max_memory_usage>200000000<' '<max_memory_usage_for_user>300000000<' \
            '<max_memory_usage><min>1</min><max>200000000<' '<max_memory_usage_for_user><min>1</min><max>300000000<'; do
            grep -qF "$s" <<<"$ch" || { echo "readonly.xml lacks $s (server-values.yaml)"; exit 1; }
          done
          def=$(helm template a deploy/helm/hopcorder-server --set clickhouse.deploy.enabled=true \
            --set clickhouse.deploy.readOnlyUser.enabled=true --show-only templates/clickhouse.yaml)
          ro=$(sed -n 's|.*<max_memory_usage_for_user>\([0-9]*\)</max_memory_usage_for_user>.*|\1|p' <<<"$def")
          gi=$(sed -n '/limits:/,/^ *[a-z]*:$/s/^ *memory: \([0-9]*\)Gi$/\1/p' <<<"$def")
          echo "read-only user: $ro bytes of ClickHouse's ${gi}Gi"
          test "$((ro * 2))" -lt "$((gi * 1024 * 1024 * 1024 * 8 / 10))"
          refused deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --set clickhouse.deploy.readOnlyUser.maxMemoryUsage=0
          refused deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --set clickhouse.deploy.readOnlyUser.maxMemoryUsage=1GB
          refused deploy/helm/hopcorder-server -f deploy/helm/ci/server-values.yaml --set clickhouse.deploy.readOnlyUser.maxMemoryUsageForUser=100
      - name: build images
        run: |
          docker build --target server -t hopcorder-server:ci .
          docker build --target agent -t hopcorder-agent:ci .
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: hc
      - run: kind load docker-image hopcorder-server:ci hopcorder-agent:ci --name hc
      - run: deploy/helm/ci/smoke.sh
      - name: cluster state
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=hopcorder-server --tail=100
          kubectl logs -l app.kubernetes.io/component=hopcorder-clickhouse --tail=50
          kubectl logs -l app.kubernetes.io/name=hopcorder-agent --tail=50 --prefix
