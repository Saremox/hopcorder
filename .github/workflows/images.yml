name: images

# Container images for the agent and the server (Dockerfile targets), the
# Helm charts and the GitHub release.
#
# - Pull requests build both images and the release assets without
#   publishing, and without any write token.
# - main pushes ghcr.io/saremox/hopcorder-{agent,server}:main and :sha-<commit>.
# - A v* tag on a commit of main also pushes :<version>, :<major>.<minor> and
#   :latest, the charts to oci://ghcr.io/saremox/charts, and creates the
#   GitHub release with Linux binaries, the chart packages and the notes for
#   that version from CHANGELOG.md. The chart and release jobs run in the
#   "release" environment (add required reviewers to it in the repository
#   settings to gate releases).
#
# Third-party actions are pinned to commits (Dependabot keeps them current);
# no job persists the checkout's credentials, and release builds use no caches.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# One run per ref at a time. On main a newer commit's run waits for the one
# pushing (two merges in a row would otherwise race, and the one finishing
# last would own :main, newer or not); a newer commit replaces a waiting run.
# A new commit on a pull request cancels the run for the one before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [agent, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}

  # A tag must point at a commit of main: nothing unreviewed is released.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  image:
    needs: verify-tag
    # main pushes, and tags that passed verify-tag.
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [agent, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/saremox/hopcorder-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hopcorder-${{ matrix.target }}
            org.opencontainers.image.description=hopcorder ${{ matrix.target }}: a flight recorder for network paths
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # Releases are built from scratch, not from a cache that other runs wrote.
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope={0}', matrix.target) || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}

  charts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1
      - name: package and push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          for chart in hopcorder-server hopcorder-agent; do
            helm package "deploy/helm/$chart" --version "$version" --app-version "$version" -d dist
            helm push "dist/$chart-$version.tgz" oci://ghcr.io/saremox/charts
          done

  # Pull requests and main: the release assets are built, nothing is published.
  release-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1
      - run: scripts/release-build.sh "0.0.0-dev+${GITHUB_SHA::7}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, charts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1
      - name: build
        run: |
          scripts/release-build.sh "${GITHUB_REF_NAME#v}"
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section '## ${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "hopcorder $GITHUB_REF_NAME" --notes-file notes.md
