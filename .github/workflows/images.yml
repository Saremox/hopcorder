name: images

# Container images for the agent and the server (Dockerfile targets), the
# Helm charts and the GitHub release. Pull requests build everything without
# publishing; main pushes ghcr.io/saremox/hopcorder-{agent,server}:main and
# :sha-<commit>; a v* tag also pushes :<version> and :latest, the charts with
# that version to oci://ghcr.io/saremox/charts, and then creates the GitHub
# release with Linux binaries, the chart packages and the notes for that
# version from CHANGELOG.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [agent, server]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/saremox/hopcorder-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hopcorder-${{ matrix.target }}
            org.opencontainers.image.description=hopcorder ${{ matrix.target }}: a flight recorder for network paths
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  charts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in hopcorder-server hopcorder-agent; do
            helm package "deploy/helm/$chart" --version "$version" --app-version "$version" -d dist
            helm push "dist/$chart-$version.tgz" oci://ghcr.io/saremox/charts
          done

  release:
    needs: [image, charts]
    # charts only runs for tags; on pull requests and main this job is a dry
    # run of everything but the release itself.
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.charts.result == 'success' || needs.charts.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: binaries
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist build
          for arch in amd64 arm64; do
            d="hopcorder_${VERSION}_linux_${arch}"
            mkdir -p "build/$d"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=v${VERSION}" -o "build/$d/hopcorder" ./cmd/hopcorder
            cp LICENSE README.md deploy/agent.example.yaml deploy/server.example.yaml \
              deploy/hopcorder.service deploy/hopcorder-server.service "build/$d/"
            tar -C build -czf "dist/$d.tar.gz" "$d"
          done
          out=$("build/hopcorder_${VERSION}_linux_amd64/hopcorder" version)
          echo "$out"
          grep -qF "v${VERSION}" <<<"$out"
      - name: charts
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for chart in hopcorder-server hopcorder-agent; do
            helm package "deploy/helm/$chart" --version "$VERSION" --app-version "$VERSION" -d dist
          done
      - name: checksums and notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # The section "## v<version>" of CHANGELOG.md, up to the next one.
          awk -v h="## v${VERSION}" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section '## v${VERSION}'" >&2
            exit 1
          fi
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "hopcorder $GITHUB_REF_NAME" --notes-file notes.md
