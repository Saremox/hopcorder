# Five-minute try-out on a Linux host: ClickHouse, the hopcorder server, an
# agent tracing a few public targets and Grafana with the dashboards. From the
# repository root:
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# then open http://localhost:3000 (anonymous read access; admin to edit, with
# the password in HOPCORDER_GRAFANA_ADMIN_PASSWORD, default "admin") or the
# server's UI at http://localhost:8080/ui/. The agent's targets are in
# deploy/compose/agent.yaml. Published ports listen on localhost only, and
# Grafana and the server only answer requests for localhost (Grafana
# redirects other host names to it), so a web page cannot reach them through
# DNS rebinding. ClickHouse is not published at all (`docker compose exec
# clickhouse clickhouse-client` to query it), and Grafana reads it with a
# read-only user whose queries are bounded in time and memory. The other
# passwords below are fixed: this is not a production setup (see README.md).
name: hopcorder

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      # The server's user; it may create users, for the init script below.
      CLICKHOUSE_USER: hopcorder
      CLICKHOUSE_PASSWORD: hopcorder
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse:/var/lib/clickhouse
      # Creates Grafana's read-only user and its limits on the first start
      # (an empty volume). The script can be re-run on an older volume:
      #   docker compose -f deploy/docker-compose.yml exec -T clickhouse clickhouse-client \
      #     --user hopcorder --password hopcorder --multiquery < deploy/compose/clickhouse-init.sql
      - ./compose/clickhouse-init.sql:/docker-entrypoint-initdb.d/grafana.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "hopcorder", "--password", "hopcorder", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  server:
    build: { context: .., target: server }
    image: hopcorder-server:local
    command: ["--config", "/etc/hopcorder/server.yaml"]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./compose/server.yaml:/etc/hopcorder/server.yaml:ro
      - server:/var/lib/hopcorder-server
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  agent:
    build: { context: .., target: agent }
    image: hopcorder-agent:local
    # Trace from the host's own network rather than through Docker's NAT.
    network_mode: host
    # Raw sockets: the image runs as root; keep CAP_NET_RAW and nothing else.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    volumes:
      - ./compose/agent.yaml:/etc/hopcorder/agent.yaml:ro
      - agent:/var/lib/hopcorder
    depends_on: [server]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Requests for any other host name are redirected to localhost, so a
      # page that rebinds its own name to 127.0.0.1 cannot use Grafana (or
      # its admin login) from the browser.
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ENFORCE_DOMAIN: "true"
      # Applied when Grafana's volume is created; to change it later, run
      # `grafana cli admin reset-admin-password` in the container.
      GF_SECURITY_ADMIN_PASSWORD: ${HOPCORDER_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hopcorder/hopcorder.json
      # Read by grafana/provisioning/datasources/hopcorder.yaml.
      HOPCORDER_CLICKHOUSE_HOST: clickhouse
      HOPCORDER_CLICKHOUSE_PORT: "8123"
      HOPCORDER_CLICKHOUSE_DATABASE: hopcorder
      HOPCORDER_CLICKHOUSE_USER: grafana # read-only (compose/clickhouse-init.sql)
      HOPCORDER_CLICKHOUSE_PASSWORD: grafana
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../dashboards:/var/lib/grafana/dashboards/hopcorder:ro
      - grafana:/var/lib/grafana
    depends_on:
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 90
    restart: unless-stopped

volumes:
  clickhouse:
  server:
  agent:
  grafana:
