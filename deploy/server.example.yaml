# hopcorder server configuration. Every key is optional; the values shown are
# the defaults. Unknown keys are rejected at startup.

# hopcorder does no authentication. Put a reverse proxy in front and secure
# /api/v1/ingest (agents: bearer token, basic auth or mTLS) separately from
# /api/v1/query/ (readers: e.g. OIDC). Hence the localhost default, but
# every local user can reach 127.0.0.1 around the proxy. To admit only the
# proxy, listen on a unix socket instead:
#   listen: systemd                         # the socket of deploy/hopcorder-server.socket
#   listen: unix:/run/hopcorder/http.sock   # created with mode 0660 (owner and group)
listen: 127.0.0.1:8080

# Host names the server answers (the Host header, any port), so a web page
# cannot reach it through DNS rebinding (its own name resolving to the
# server's address). Default: on a loopback listen address, localhost,
# 127.0.0.1, ::1 and the listen host (a reverse proxy on the same host that
# passes the client's Host header on, as Caddy and Traefik do and nginx by
# default does not, then needs its public names listed here); on a unix
# socket and on any other address, no check: a socket is reached only
# through the proxy, and elsewhere the server cannot know its service, pod
# and ingress names (the Helm chart sets its own). List them to get the
# check, also on a socket behind a proxy that admits clients by address
# rather than by credentials. "*.example.net" allows the names one label
# below example.net. "*" turns the check off. /healthz, /readyz and
# /metrics answer every host.
# allowed_hosts: [localhost, 127.0.0.1, "::1"]

log:
  level: info                   # debug, info, warn, error
  format: text                  # text or json

clickhouse:                     # the HTTP interface
  url: http://127.0.0.1:8123
  database: hopcorder           # created on startup if missing; migrations run automatically
  user: default
  # The password from a file. Under systemd the unit's dynamic user can only
  # read world-readable files (this one included): pass it as a credential
  # (LoadCredential= in deploy/hopcorder-server.service), then
  # password_file: /run/credentials/hopcorder-server.service/clickhouse-password
  # (password: "..." also works, only where no one else can read this file)
  timeout: 30s
  retention_days: 90            # like the prototype; 0 keeps data forever

ingest:
  max_body_bytes: 8MiB          # compressed request body
  max_decoded_bytes: 32MiB      # after decompression (an agent's batch is 1MiB by default); a request
                                # being processed holds about twice this in memory
  max_concurrent: 4             # requests processed at once; more wait, then get 503 (agents retry)
  max_streams: 20000            # (agent, target, protocol, flow) tracked in memory, 1 to 9 KiB each
  max_agents: 10000             # agents tracked in memory (under 1 KiB each, besides their streams)
  stream_idle_timeout: 1h       # idle streams are dropped and restored from ClickHouse when they return
  max_record_age: 720h          # older records are refused (keep it above the agents' spool max_age)

query:
  max_concurrent: 8             # read-API requests at once
  max_response_bytes: 32MiB     # rows per response; beyond it rows are left out and "truncated": true
  max_memory_bytes: 1GiB        # ClickHouse max_memory_usage of each read-API query

enrich:
  rdns:
    enabled: true               # names are looked up in the background, never blocking ingest
    workers: 4
    ttl: 24h
    negative_ttl: 1h
    max_entries: 100000
  asn:
    enabled: true
    # Downloaded daily and cached in file; set url: "" to only read file,
    # e.g. when the server has no internet access and you update it yourself.
    url: https://iptoasn.com/data/ip2asn-combined.tsv.gz
    file: /var/lib/hopcorder-server/ip2asn-combined.tsv.gz
    refresh: 24h

metrics: true                   # serve Prometheus metrics on /metrics
ui: true                        # serve the web UI on /ui/
