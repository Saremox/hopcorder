# hopcorder agent configuration. Every key is optional unless marked required;
# the values shown are the defaults. Unknown keys are rejected at startup.

# agent_id: lab-01              # default: the hostname
interval: 5s                    # minimum period between cycles, per target
timeout: 1s                     # per-probe timeout; must be < interval
max_ttl: 30                     # TTLs 1..max_ttl are probed at once each cycle
probe_past: 2                   # silent TTLs kept past the last responder if unreached
protocol: icmp                  # default for targets: icmp, udp or tcp
flow_id: 33434                  # ICMP identifier / UDP, TCP source port; one per hopcorder process on a host
paris: true                     # flow-stable probing (keeps ECMP on one path)
adaptive_max_ttl: true          # stop a few TTLs past the destination (records unchanged)
dns_ttl: 5m                     # re-resolve hostnames this often

log:
  level: info                   # debug, info, warn, error
  format: text                  # text or json

spool:
  dir: /var/lib/hopcorder       # required (except with --once)
  max_age: 168h
  max_bytes: 1GiB

targets:                        # required: at least one
  - host: example.net
  - host: 192.0.2.10
    protocol: udp
    port: 33434                 # udp/tcp only; default 33434 (udp), 443 (tcp)
  - host: example.org
    protocol: tcp               # SYN probes: answered by SYN-ACK or RST
  # Per-target overrides: protocol, port, af (4|6), flow_id, paris,
  # adaptive_max_ttl, interval, timeout, max_ttl, probe_past.
  # - host: dual-stack.example.net
  #   af: 6
  #   interval: 30s

outputs:                        # at least one
  jsonl:
    path: /var/log/hopcorder/records.jsonl   # "-" for stdout

  # http:
  #   url: https://hopcorder.example.net     # POSTs to <url>/api/v1/ingest
  #   # Secrets come from files. Under systemd the unit's dynamic user can
  #   # only read world-readable files (this one included), so pass each
  #   # secret as a credential (LoadCredential= in deploy/hopcorder.service)
  #   # and point here at /run/credentials/hopcorder.service/<name>.
  #   # (bearer_token and basic_auth.password also take a secret inline: only
  #   # where no one else can read this file.)
  #   bearer_token_file: /run/credentials/hopcorder.service/token
  #   # or: basic_auth: {username: agent, password_file: /run/credentials/hopcorder.service/password}
  #   headers: {X-Tenant: lab}               # sent as written: not for secrets
  #   tls:
  #     ca_file: /etc/hopcorder/ca.pem       # replaces the system roots
  #     cert_file: /etc/hopcorder/client.pem # client certificate (mTLS)
