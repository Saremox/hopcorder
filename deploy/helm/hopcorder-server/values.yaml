# hopcorder server. Needs a ClickHouse reachable over its HTTP interface
# (or set clickhouse.deploy.enabled for a single ClickHouse pod next to it);
# the server creates its database and applies migrations on startup.

image:
  repository: ghcr.io/saremox/hopcorder-server
  tag: ""                     # default: the chart's appVersion
  # The digest (sha256:...) of the appVersion's image, used while tag is
  # empty: the chart then runs repository:appVersion@digest, whatever the
  # tag names by now. The charts of a release carry their images' digests;
  # empty (a checkout), the tag alone names the image. A tag of your own
  # replaces both (tag: X.Y.Z@sha256:... pins it).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The server's configuration file (see deploy/server.example.yaml for every
# key; unknown keys are rejected). The chart sets listen, the ASN cache file,
# allowed_hosts unless set here (see allowedHosts below), with
# clickhouse.passwordSecret or clickhouse.deploy clickhouse.password_file,
# and with clickhouse.deploy clickhouse.url and clickhouse.user, and
# query.max_concurrent and query.max_memory_bytes unless set here (see
# clickhouse.deploy.resources); it refuses clickhouse.password (it would
# land in a ConfigMap, readable with the built-in view role). For an
# external ClickHouse, keep query.max_concurrent x query.max_memory_bytes
# (by default 8 x 1GiB) to about a third of what it may use.
config:
  log:
    level: info
    format: json
  clickhouse:
    url: http://clickhouse:8123
    database: hopcorder
    user: default
    timeout: 30s
    retention_days: 90        # 0 keeps data forever
  # ingest: the server's defaults (deploy/server.example.yaml) fit
  # resources.limits.memory below. A request holds up to about three times
  # its decompressed size in memory while it is processed, plus about 32MiB
  # while it is stored (one part of it and its events at a time), so raise
  # the memory limit with (3 x max_decoded_bytes + 32MiB) x max_concurrent,
  # plus the stream state (170MiB at max_streams 20000) and the 32MiB read
  # buffer: 512 + 170 + 32MiB with the defaults,
  #   max_decoded_bytes: 32MiB
  #   max_concurrent: 4
  enrich:
    rdns:
      enabled: true
    asn:
      enabled: true
      # url: ""               # no internet: maintain the file yourself (persistence)
      refresh: 24h
  metrics: true
  ui: true

clickhouse:
  # The ClickHouse password from an existing Secret: for an external
  # ClickHouse, or to choose the password of the one deployed below.
  passwordSecret:
    name: ""
    key: password

  # A single ClickHouse pod for this server (opt-in), for when hopcorder is a
  # monitoring aid rather than a production service: a StatefulSet of the
  # official clickhouse/clickhouse-server image with a persistent volume, no
  # operator, no replication and no backups (snapshot the volume if you want
  # them; retention_days bounds the data). When enabled, the chart points
  # config.clickhouse.url and user at it, and the server reads the password
  # from clickhouse.passwordSecret or, without one, from a Secret the chart
  # generates once (<release>-hopcorder-server-clickhouse, key password) and
  # keeps across upgrades. For high availability use an operator or a
  # managed ClickHouse instead and leave this off.
  deploy:
    enabled: false
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.8"             # the LTS line every test of hopcorder uses
      pullPolicy: IfNotPresent
    # The server's ClickHouse user; the image's passwordless "default" user
    # is removed.
    user: hopcorder
    persistence:
      size: 20Gi
      storageClass: ""
      accessModes: [ReadWriteOnce]
    # Caches are sized for a small instance, and the server may use 80% of
    # the memory limit. The read API's queries get a third of that, two at a
    # time: config.query.max_concurrent 2 and max_memory_bytes 80% x limit /
    # 3 / max_concurrent (273MiB for 2Gi), unless config.query sets them.
    # Planted data costs a read query up to about 200MiB; one that needs
    # more than its budget fails rather than taking memory from ingest.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    # Days ClickHouse keeps its own query, metric and trace logs.
    systemLogRetentionDays: 7
    # A read-only user for Grafana's ClickHouse data source: SELECT on the
    # hopcorder database only, readonly = 1 (its queries may set no setting
    # but max_execution_time, up to 300 s: keep the data source's query
    # timeout at 295 s or below, and add no custom settings or row limit),
    # bounded memory and concurrency, and no temporary data on disk (like
    # deploy/compose/clickhouse-init.sql).
    # Its password comes from passwordSecret or a generated Secret
    # (<release>-hopcorder-server-clickhouse-readonly, key password).
    readOnlyUser:
      enabled: false
      name: grafana
      passwordSecret:
        name: ""
        key: password
      # Bytes of memory per query, and for all of its queries together.
      # Sized for resources.limits.memory above (2Gi, of which ClickHouse
      # may use 80%): Grafana gets under 40%, the rest stays for the
      # server's inserts and reads, ClickHouse's caches and itself. Scale
      # them with the memory limit. The dashboards' largest query took
      # 17 MiB on a week of eight streams.
      maxMemoryUsage: 400000000
      maxMemoryUsageForUser: 600000000
    # Only the hopcorder server may reach ClickHouse (with a CNI that
    # enforces NetworkPolicy); add other peers here, e.g. Grafana's namespace
    # by kubernetes.io/metadata.name.
    networkPolicy:
      enabled: true
      from: []
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101          # the image's clickhouse user
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    # The image writes its user file under /etc/clickhouse-server at start,
    # so the root file system stays writable.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# The ASN database cache. Without a volume it lives in an emptyDir and is
# downloaded again whenever the pod is replaced (about 10 MB).
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# The Host names the server answers (config allowed_hosts, any port), so a
# web page cannot reach it through DNS rebinding, e.g. while you run
# `kubectl port-forward` and open the UI on 127.0.0.1: the page's name
# resolves to 127.0.0.1, but the browser still sends that name. By default
# the server answers localhost, 127.0.0.1 and ::1, the Service's names
# (<fullname>, <fullname>.<namespace>, .svc and .svc.<clusterDomain>) and
# the ingress hosts; other requests get 421. /healthz, /readyz and /metrics
# answer any name (probes and Prometheus use the pod's address). List here
# the other names clients use: another Ingress, a Gateway or a proxy that
# passes the client's Host on, a NodePort or LoadBalancer address (the chart
# refuses those Service types, and an ingress rule without host, until you
# do). "*.example.net" allows one label below example.net. ["*"] turns the
# check off. config.allowed_hosts, if set, replaces all of this.
allowedHosts: []
clusterDomain: cluster.local

# hopcorder does no authentication. Secure /api/v1/ingest (agents) and
# /api/v1/query/ and /ui/ (readers) at the ingress or proxy, e.g. with
# auth annotations of your ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hopcorder.example.net
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Who may connect to the server. Clients inside the cluster reach the
# Service directly, around whatever authentication the ingress does; with a
# CNI that enforces NetworkPolicy, this limits them to the peers listed in
# `from` (NetworkPolicy "from" entries), which must then not be empty.
# Select peers by namespace: Kubernetes sets kubernetes.io/metadata.name to
# the namespace's name, and no one can change it, while anyone who may create
# a pod in some namespace can give it any pod label. For example:
#   from:
#     # the agents, in their own namespace
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: hopcorder-agent
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: hopcorder-agent
#     # the ingress controller and Prometheus
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: ingress-nginx
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: monitoring
#     # agents with hostNetwork (mode: daemonset) come from the nodes'
#     # addresses, e.g.
#     - ipBlock:
#         cidr: 192.0.2.0/24
networkPolicy:
  enabled: false
  from: []

# Prometheus Operator ServiceMonitor for /metrics (config.metrics: true).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

extraArgs: []
