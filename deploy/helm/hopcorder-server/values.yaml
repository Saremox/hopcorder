# hopcorder server. Needs a ClickHouse reachable over its HTTP interface;
# the server creates its database and applies migrations on startup.

image:
  repository: ghcr.io/saremox/hopcorder-server
  tag: ""                     # default: the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The server's configuration file (see deploy/server.example.yaml for every
# key; unknown keys are rejected). The chart sets listen, the ASN cache file
# and, with clickhouse.passwordSecret, clickhouse.password_file; it refuses
# clickhouse.password (it would land in a ConfigMap, readable with the
# built-in view role).
config:
  log:
    level: info
    format: json
  clickhouse:
    url: http://clickhouse:8123
    database: hopcorder
    user: default
    timeout: 30s
    retention_days: 90        # 0 keeps data forever
  # ingest: the server's defaults (deploy/server.example.yaml) fit
  # resources.limits.memory below. A request holds up to about twice its
  # decompressed size in memory while it is processed, so raise the memory
  # limit with max_decoded_bytes x max_concurrent, e.g.
  #   max_decoded_bytes: 32MiB
  #   max_concurrent: 4
  enrich:
    rdns:
      enabled: true
    asn:
      enabled: true
      # url: ""               # no internet: maintain the file yourself (persistence)
      refresh: 24h
  metrics: true
  ui: true

clickhouse:
  # The ClickHouse password from an existing Secret.
  passwordSecret:
    name: ""
    key: password

# The ASN database cache. Without a volume it lives in an emptyDir and is
# downloaded again whenever the pod is replaced (about 10 MB).
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# hopcorder does no authentication. Secure /api/v1/ingest (agents) and
# /api/v1/query/ and /ui/ (readers) at the ingress or proxy, e.g. with
# auth annotations of your ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hopcorder.example.net
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Who may connect to the server. Clients inside the cluster reach the
# Service directly, around whatever authentication the ingress does; with a
# CNI that enforces NetworkPolicy, this limits them to the peers listed in
# `from` (NetworkPolicy "from" entries), which must then not be empty.
# Select peers by namespace: Kubernetes sets kubernetes.io/metadata.name to
# the namespace's name, and no one can change it, while anyone who may create
# a pod in some namespace can give it any pod label. For example:
#   from:
#     # the agents, in their own namespace
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: hopcorder-agent
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: hopcorder-agent
#     # the ingress controller and Prometheus
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: ingress-nginx
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: monitoring
#     # agents with hostNetwork (mode: daemonset) come from the nodes'
#     # addresses, e.g.
#     - ipBlock:
#         cidr: 192.0.2.0/24
networkPolicy:
  enabled: false
  from: []

# Prometheus Operator ServiceMonitor for /metrics (config.metrics: true).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

extraArgs: []
