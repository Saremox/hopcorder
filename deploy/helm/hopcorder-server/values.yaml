# hopcorder server. Needs a ClickHouse reachable over its HTTP interface
# (or set clickhouse.deploy.enabled for a single ClickHouse pod next to it);
# the server creates its database and applies migrations on startup.

image:
  repository: ghcr.io/saremox/hopcorder-server
  tag: ""                     # default: the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The server's configuration file (see deploy/server.example.yaml for every
# key; unknown keys are rejected). The chart sets listen, the ASN cache file,
# with clickhouse.passwordSecret or clickhouse.deploy clickhouse.password_file,
# and with clickhouse.deploy clickhouse.url and clickhouse.user; it refuses
# clickhouse.password (it would land in a ConfigMap, readable with the
# built-in view role).
config:
  log:
    level: info
    format: json
  clickhouse:
    url: http://clickhouse:8123
    database: hopcorder
    user: default
    timeout: 30s
    retention_days: 90        # 0 keeps data forever
  # ingest: the server's defaults (deploy/server.example.yaml) fit
  # resources.limits.memory below. A request holds up to about twice its
  # decompressed size in memory while it is processed, so raise the memory
  # limit with max_decoded_bytes x max_concurrent, e.g.
  #   max_decoded_bytes: 32MiB
  #   max_concurrent: 4
  enrich:
    rdns:
      enabled: true
    asn:
      enabled: true
      # url: ""               # no internet: maintain the file yourself (persistence)
      refresh: 24h
  metrics: true
  ui: true

clickhouse:
  # The ClickHouse password from an existing Secret: for an external
  # ClickHouse, or to choose the password of the one deployed below.
  passwordSecret:
    name: ""
    key: password

  # A single ClickHouse pod for this server (opt-in), for when hopcorder is a
  # monitoring aid rather than a production service: a StatefulSet of the
  # official clickhouse/clickhouse-server image with a persistent volume, no
  # operator, no replication and no backups (snapshot the volume if you want
  # them; retention_days bounds the data). When enabled, the chart points
  # config.clickhouse.url and user at it, and the server reads the password
  # from clickhouse.passwordSecret or, without one, from a Secret the chart
  # generates once (<release>-hopcorder-server-clickhouse, key password) and
  # keeps across upgrades. For high availability use an operator or a
  # managed ClickHouse instead and leave this off.
  deploy:
    enabled: false
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.8"             # the LTS line every test of hopcorder uses
      pullPolicy: IfNotPresent
    # The server's ClickHouse user; the image's passwordless "default" user
    # is removed.
    user: hopcorder
    persistence:
      size: 20Gi
      storageClass: ""
      accessModes: [ReadWriteOnce]
    # Caches are sized for a small instance, and the server may use 80% of
    # the memory limit.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    # Days ClickHouse keeps its own query, metric and trace logs.
    systemLogRetentionDays: 7
    # A read-only user for Grafana's ClickHouse data source: SELECT on the
    # hopcorder database only, with bounded query time, memory and
    # concurrency (like deploy/compose/clickhouse-init.sql). Its password
    # comes from passwordSecret or a generated Secret
    # (<release>-hopcorder-server-clickhouse-readonly, key password).
    readOnlyUser:
      enabled: false
      name: grafana
      passwordSecret:
        name: ""
        key: password
    # Only the hopcorder server may reach ClickHouse (with a CNI that
    # enforces NetworkPolicy); add other peers here, e.g. Grafana's namespace
    # by kubernetes.io/metadata.name.
    networkPolicy:
      enabled: true
      from: []
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101          # the image's clickhouse user
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    # The image writes its user file under /etc/clickhouse-server at start,
    # so the root file system stays writable.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# The ASN database cache. Without a volume it lives in an emptyDir and is
# downloaded again whenever the pod is replaced (about 10 MB).
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# hopcorder does no authentication. Secure /api/v1/ingest (agents) and
# /api/v1/query/ and /ui/ (readers) at the ingress or proxy, e.g. with
# auth annotations of your ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hopcorder.example.net
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Who may connect to the server. Clients inside the cluster reach the
# Service directly, around whatever authentication the ingress does; with a
# CNI that enforces NetworkPolicy, this limits them to the peers listed in
# `from` (NetworkPolicy "from" entries), which must then not be empty.
# Select peers by namespace: Kubernetes sets kubernetes.io/metadata.name to
# the namespace's name, and no one can change it, while anyone who may create
# a pod in some namespace can give it any pod label. For example:
#   from:
#     # the agents, in their own namespace
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: hopcorder-agent
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: hopcorder-agent
#     # the ingress controller and Prometheus
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: ingress-nginx
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: monitoring
#     # agents with hostNetwork (mode: daemonset) come from the nodes'
#     # addresses, e.g.
#     - ipBlock:
#         cidr: 192.0.2.0/24
networkPolicy:
  enabled: false
  from: []

# Prometheus Operator ServiceMonitor for /metrics (config.metrics: true).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

extraArgs: []
