{{- /*
A single ClickHouse pod for this server (clickhouse.deploy): the official
image, one replica, a persistent volume, no operator. See values.yaml.
*/ -}}
{{- if .Values.clickhouse.deploy.enabled }}
{{- $d := .Values.clickhouse.deploy }}
{{- $name := include "hopcorder-server.clickhouseName" . }}
{{- $days := int $d.systemLogRetentionDays }}
{{- if lt $days 1 }}
{{- fail "clickhouse.deploy.systemLogRetentionDays: at least 1" }}
{{- end }}
{{- /* These names go into ClickHouse's XML configuration and a GRANT. */}}
{{- $ident := "^[A-Za-z_][A-Za-z0-9_]{0,62}$" }}
{{- if not (regexMatch $ident (toString $d.user)) }}
{{- fail "clickhouse.deploy.user: letters, digits and _ (not starting with a digit)" }}
{{- end }}
{{- if and $d.readOnlyUser.enabled (or (not (regexMatch $ident (toString $d.readOnlyUser.name))) (eq $d.readOnlyUser.name $d.user)) }}
{{- fail "clickhouse.deploy.readOnlyUser.name: letters, digits and _ (not starting with a digit), other than clickhouse.deploy.user" }}
{{- end }}
{{- /* Bytes; int64 also turns a YAML number into digits (toString gives 5e+08). */}}
{{- $roQuery := int64 $d.readOnlyUser.maxMemoryUsage }}
{{- $roUser := int64 $d.readOnlyUser.maxMemoryUsageForUser }}
{{- if and $d.readOnlyUser.enabled (or (lt $roQuery 1) (lt $roUser $roQuery)) }}
{{- fail "clickhouse.deploy.readOnlyUser: maxMemoryUsage at least 1 (bytes), maxMemoryUsageForUser at least maxMemoryUsage" }}
{{- end }}
{{- /* Temporary data: a tenth of the volume unless set, at most a fifth of it
(the system logs leave a quarter free, but not for temporary data). */}}
{{- $vol := include "hopcorder-server.clickhouseVolumeBytes" . | int64 }}
{{- $tmp := div $vol 10 }}
{{- $set := $d.maxTemporaryDataOnDisk }}
{{- if and (not (kindIs "invalid" $set)) (ne (toString $set) "") }}
{{- $tmp = int64 $set }}
{{- end }}
{{- if or (lt $tmp 1) (gt $tmp (div $vol 5)) }}
{{- fail (printf "clickhouse.deploy.maxTemporaryDataOnDisk: bytes, at least 1 and at most a fifth of persistence.size (%d), or empty for a tenth of it" (div $vol 5)) }}
{{- end }}
{{- $db := .Values.config.clickhouse.database | default "hopcorder" }}
{{- if not (regexMatch $ident (toString $db)) }}
{{- fail "config.clickhouse.database: letters, digits and _ (not starting with a digit) with clickhouse.deploy" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: hopcorder-clickhouse
data:
  # Merged into the image's config.xml: logs to the console only, caches
  # sized for a small instance, the system log tables pruned, and
  # user_files_path and format_schema_path an empty directory the
  # clickhouse user (uid 101) cannot write: sqlite() creates its file under
  # user_files before it checks the caller's grant (review round six), and
  # a CapnProto or Protobuf output without a schema leaves its generated
  # schema file under format_schemas when generating it fails (review round
  # seven), so the read-only user, refused every time, left an empty file
  # per query until the volume ran out of inodes. The system logs live on a
  # disk of their own on the same volume that keeps a quarter of it free:
  # one failing query of the read-only user wrote its exception message,
  # up to its memory limit, into query_log and three times into text_log
  # (about 100 MB), so a few hundred filled the volume before any TTL
  # (review round seven). Now log writes stop, and are dropped, while less
  # than 25% of the volume is free; inserts and merges of hopcorder's data
  # may use the rest. Every log the image turns on is there (a refused
  # BACKUP still wrote its whole destination into backup_log), but for
  # opentelemetry_span_log, which kept a traced query's exception three
  # times and cannot take a storage policy (the image gives it an engine):
  # it is off, hopcorder does not trace.
  hopcorder.xml: |
    <clickhouse>
        <user_files_path>/srv/</user_files_path>
        <format_schema_path>/srv/</format_schema_path>
        <!-- remote() and the like resolve their host before the grant
             check; with this they resolve nothing (review round seven). -->
        <remote_url_allow_hosts><host>localhost</host></remote_url_allow_hosts>
        <!-- All temporary data on the volume together, from every user: a
             result buffered for wait_end_of_query (a URL parameter, not a
             setting: any HTTP client with a password may send it, and one
             with the read-only user's filled the volume, review round
             seven) and the server's spills. -->
        <max_temporary_data_on_disk_size>{{ $tmp }}</max_temporary_data_on_disk_size>
        <logger>
            <level>warning</level>
            <console>1</console>
            <log remove="remove"/>
            <errorlog remove="remove"/>
            <levels>
                <logger><name>executeQuery</name><level>fatal</level></logger>
                <logger><name>DynamicQueryHandler</name><level>fatal</level></logger>
                <logger><name>HTTPHandler</name><level>fatal</level></logger>
                <logger><name>TCPHandler</name><level>fatal</level></logger>
                <logger><name>BackupsWorker</name><level>fatal</level></logger>
                <!-- A host name a query passes to hasColumnInTable() (up
                     to 1 MB): logged four times when it fails to resolve,
                     again each time the DNS cache retries it, and once more
                     by Cluster, about 15 MB per query (review round seven). -->
                <logger><name>DNSResolver</name><level>fatal</level></logger>
                <logger><name>Cluster</name><level>fatal</level></logger>
            </levels>
        </logger>
        <!-- No MySQL, PostgreSQL or interserver listener: the server uses
             HTTP, and the PostgreSQL handlers also log a failing query's
             whole message. The native port listens on loopback only (for
             clickhouse-client in the pod): before its password check
             ClickHouse reserves memory for the user name a login declares,
             up to 1 GiB, so two connections from any pod (without a CNI
             that enforces the NetworkPolicy) OOM-killed it, and a query's
             hasColumnInTable() could make it log in to itself with a 1 MB
             name (review round eight). [::1] is skipped, with a warning,
             where the pod has no IPv6. -->
        <tcp_port remove="1"/>
        <protocols>
            <native_ipv4><type>tcp</type><host>127.0.0.1</host><port>9000</port></native_ipv4>
            <native_ipv6><type>tcp</type><host>::1</host><port>9000</port></native_ipv6>
        </protocols>
        <mysql_port remove="1"/>
        <postgresql_port remove="1"/>
        <interserver_http_port remove="1"/>
        <mark_cache_size>268435456</mark_cache_size>
        <index_mark_cache_size>67108864</index_mark_cache_size>
        <uncompressed_cache_size>134217728</uncompressed_cache_size>
        <max_server_memory_usage_to_ram_ratio>0.8</max_server_memory_usage_to_ram_ratio>
        <storage_configuration>
            <disks>
                <system_logs>
                    <path>/var/lib/clickhouse/system_logs/</path>
                    <keep_free_space_ratio>0.25</keep_free_space_ratio>
                </system_logs>
            </disks>
            <policies>
                <system_logs><volumes><main><disk>system_logs</disk></main></volumes></system_logs>
            </policies>
        </storage_configuration>
        {{- range list "query_log" "query_thread_log" "query_views_log" "query_metric_log" "part_log" "trace_log" "metric_log" "asynchronous_metric_log" "error_log" "text_log" "processors_profile_log" "backup_log" "asynchronous_insert_log" "blob_storage_log" "crash_log" "iceberg_metadata_log" "s3queue_log" }}
        <{{ . }}><storage_policy>system_logs</storage_policy><ttl>event_date + INTERVAL {{ $days }} DAY DELETE</ttl></{{ . }}>
        {{- end }}
        <opentelemetry_span_log remove="1"/>
    </clickhouse>
  {{- if $d.readOnlyUser.enabled }}
  # The read-only user (for Grafana): SELECT on the hopcorder database only,
  # as in deploy/compose/clickhouse-init.sql, which explains each setting.
  # (ClickHouse 25.8 checks no grant for joinGet() on Join tables or IN on
  # Set tables of any database; this ClickHouse has none, review round eight.)
  # readonly = 1: a query may change no setting but max_execution_time (1 to
  # 300 s), which the Grafana plugin sends; others turned off memory
  # tracking (one query OOM-killed ClickHouse), pinned memory in the query
  # cache or made ClickHouse write MB/s of its own logs. Memory per query
  # and for all of the user's queries: readOnlyUser.maxMemoryUsage and
  # maxMemoryUsageForUser. The cancel setting needs readonly > 0. The
  # constraints stay for readonly = 2: the spill settings constant (with
  # one of them a query wrote temporary data to the data volume until it
  # was full), the limits with MIN 1 (0 means "unlimited"). No hyperscan:
  # its compiled patterns stay in a global cache outside every memory
  # limit (ten queries OOM-killed ClickHouse). No generated CapnProto or
  # Protobuf schemas: a failed one left a file per query (also kept out by
  # format_schema_path above). Its time-zone tables stay in
  # one too, and nothing here can stop that: the user's queries can still
  # OOM-kill ClickHouse, so only trusted users may have it.
  readonly.xml: |
    <clickhouse>
        <profiles>
            <hopcorder_readonly>
                <readonly>1</readonly>
                <max_execution_time>60</max_execution_time>
                <max_memory_usage>{{ $roQuery }}</max_memory_usage>
                <max_memory_usage_for_user>{{ $roUser }}</max_memory_usage_for_user>
                <max_concurrent_queries_for_user>16</max_concurrent_queries_for_user>
                <cancel_http_readonly_queries_on_client_close>1</cancel_http_readonly_queries_on_client_close>
                <max_bytes_before_external_sort>0</max_bytes_before_external_sort>
                <max_bytes_ratio_before_external_sort>0</max_bytes_ratio_before_external_sort>
                <max_bytes_before_external_group_by>0</max_bytes_before_external_group_by>
                <max_bytes_ratio_before_external_group_by>0</max_bytes_ratio_before_external_group_by>
                <join_algorithm>direct,parallel_hash,hash</join_algorithm>
                <allow_hyperscan>0</allow_hyperscan>
                <format_capn_proto_use_autogenerated_schema>0</format_capn_proto_use_autogenerated_schema>
                <format_protobuf_use_autogenerated_schema>0</format_protobuf_use_autogenerated_schema>
                <constraints>
                    <readonly><const/></readonly>
                    <max_execution_time><min>1</min><max>300</max><changeable_in_readonly/></max_execution_time>
                    <max_memory_usage><min>1</min><max>{{ $roQuery }}</max></max_memory_usage>
                    <max_memory_usage_for_user><min>1</min><max>{{ $roUser }}</max></max_memory_usage_for_user>
                    <max_concurrent_queries_for_user><min>1</min><max>16</max></max_concurrent_queries_for_user>
                    <cancel_http_readonly_queries_on_client_close><const/></cancel_http_readonly_queries_on_client_close>
                    <max_bytes_before_external_sort><const/></max_bytes_before_external_sort>
                    <max_bytes_ratio_before_external_sort><const/></max_bytes_ratio_before_external_sort>
                    <max_bytes_before_external_group_by><const/></max_bytes_before_external_group_by>
                    <max_bytes_ratio_before_external_group_by><const/></max_bytes_ratio_before_external_group_by>
                    <join_algorithm><const/></join_algorithm>
                    <allow_hyperscan><const/></allow_hyperscan>
                    <format_capn_proto_use_autogenerated_schema><const/></format_capn_proto_use_autogenerated_schema>
                    <format_protobuf_use_autogenerated_schema><const/></format_protobuf_use_autogenerated_schema>
                </constraints>
            </hopcorder_readonly>
        </profiles>
        <users>
            <{{ $d.readOnlyUser.name }}>
                <password from_env="CLICKHOUSE_READONLY_PASSWORD"/>
                <networks><ip>::/0</ip></networks>
                <profile>hopcorder_readonly</profile>
                <quota>default</quota>
                <grants><query>GRANT SELECT ON {{ $db }}.*</query></grants>
            </{{ $d.readOnlyUser.name }}>
        </users>
    </clickhouse>
  {{- end }}
{{- if not .Values.clickhouse.passwordSecret.name }}
---
# The server's ClickHouse password, generated once and kept by later
# upgrades (helm reads the existing Secret back). A renderer that cannot read
# the cluster (helm template, Argo CD, Kustomize's helmCharts) generates a
# new one every time, and ClickHouse and the server read it only at start:
# the Secret is immutable, so applying such a render fails rather than
# change the password under them (review, round seven). With those, set
# clickhouse.passwordSecret (and readOnlyUser.passwordSecret).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: hopcorder-clickhouse
type: Opaque
immutable: true
data:
  password: {{ include "hopcorder-server.generatedPassword" (list . $name) }}
{{- end }}
{{- if and $d.readOnlyUser.enabled (not $d.readOnlyUser.passwordSecret.name) }}
---
# The read-only user's password, generated and kept the same way.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hopcorder-server.clickhouseReadOnlySecret" . }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: hopcorder-clickhouse
type: Opaque
immutable: true
data:
  password: {{ include "hopcorder-server.generatedPassword" (list . (include "hopcorder-server.clickhouseReadOnlySecret" .)) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: hopcorder-clickhouse
spec:
  type: ClusterIP
  selector:
    {{- include "hopcorder-server.clickhouseSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: hopcorder-clickhouse
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "hopcorder-server.clickhouseSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The ConfigMap's inputs (and the chart version, for its text).
        checksum/config: {{ printf "%v|%v|%v|%v|%v" .Chart.Version $days $d.readOnlyUser $db $tmp | sha256sum }}
        {{- with $d.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hopcorder-server.clickhouseSelectorLabels" . | nindent 8 }}
    spec:
      # ClickHouse does not talk to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $d.podSecurityContext | nindent 8 }}
      containers:
        - name: clickhouse
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          imagePullPolicy: {{ $d.image.pullPolicy }}
          env:
            # The image's entrypoint creates this user (with access to every
            # database, for the server's migrations) and removes "default".
            - name: CLICKHOUSE_USER
              value: {{ $d.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hopcorder-server.clickhousePasswordSecret" . }}
                  key: {{ include "hopcorder-server.clickhousePasswordKey" . }}
            {{- if $d.readOnlyUser.enabled }}
            - name: CLICKHOUSE_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hopcorder-server.clickhouseReadOnlySecret" . }}
                  key: {{ include "hopcorder-server.clickhouseReadOnlyKey" . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $d.resources | nindent 12 }}
          securityContext:
            {{- toYaml $d.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # Single files, so the image's own config.d and users.d stay.
            - name: config
              mountPath: /etc/clickhouse-server/config.d/hopcorder.xml
              subPath: hopcorder.xml
              readOnly: true
            {{- if $d.readOnlyUser.enabled }}
            - name: config
              mountPath: /etc/clickhouse-server/users.d/readonly.xml
              subPath: readonly.xml
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml $d.persistence.accessModes | nindent 10 }}
        {{- with $d.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $d.persistence.size }}
{{- if $d.networkPolicy.enabled }}
---
# Only the hopcorder server (and networkPolicy.from) may reach ClickHouse,
# and ClickHouse may reach nothing: Grafana's read-only user can make it open
# connections to any host and port with hasColumnInTable('host:port', ...),
# which no grant covers, and look up any name (review round seven; a rule
# for DNS let it reach port 53 anywhere). ClickHouse here needs neither an
# outbound connection nor DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: hopcorder-clickhouse
spec:
  podSelector:
    matchLabels:
      {{- include "hopcorder-server.clickhouseSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hopcorder-server.selectorLabels" . | nindent 14 }}
        {{- with $d.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress: []
{{- end }}
{{- end }}
