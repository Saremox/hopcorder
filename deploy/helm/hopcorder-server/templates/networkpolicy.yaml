{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.from }}
{{- fail "networkPolicy.from: list who may connect (the agents' namespace, the ingress controller, Prometheus), e.g. by kubernetes.io/metadata.name; see the chart's values.yaml" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hopcorder-server.fullname" . }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hopcorder-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
