apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hopcorder-server.fullname" . }}
  labels:
    {{- include "hopcorder-server.labels" . | nindent 4 }}
spec:
  # One replica: the server derives route changes and outages from each
  # stream's previous cycles, kept in memory (and restored on start). Two
  # servers receiving the same agent would each see half its cycles. For the
  # same reason a new pod only starts once the old one is gone.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hopcorder-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "hopcorder-server.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hopcorder-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The server does not talk to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          {{- /* The chart's own version by digest (released charts carry
          it), or the tag given. */}}
          {{- $digest := .Values.image.digest | default "" }}
          {{- if and $digest (not (regexMatch "^sha256:[0-9a-f]{64}$" $digest)) }}
          {{- fail (printf "image.digest: %q is not sha256:<64 hex digits>" $digest) }}
          {{- end }}
          {{- $tag := .Values.image.tag }}
          {{- if not $tag }}
          {{- $tag = .Chart.AppVersion }}
          {{- if $digest }}
          {{- $tag = printf "%s@%s" $tag $digest }}
          {{- end }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/hopcorder/server.yaml
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            # Not ready until the schema is applied and while ClickHouse is
            # unreachable; agents keep spooling meanwhile.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/hopcorder/server.yaml
              subPath: server.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/hopcorder-server
            {{- if include "hopcorder-server.clickhousePasswordSecret" . }}
            - name: clickhouse-password
              mountPath: /etc/hopcorder/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hopcorder-server.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "hopcorder-server.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with include "hopcorder-server.clickhousePasswordSecret" . }}
        - name: clickhouse-password
          secret:
            secretName: {{ . }}
            items:
              - key: {{ include "hopcorder-server.clickhousePasswordKey" $ }}
                path: clickhouse-password
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
