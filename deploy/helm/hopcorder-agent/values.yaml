# hopcorder agent. Needs CAP_NET_RAW for raw sockets, so it runs as root with
# every other capability dropped. Pod Security "baseline" does not allow
# adding NET_RAW (nor hostNetwork or hostPath for mode: daemonset): install it
# in a namespace of its own, labelled pod-security.kubernetes.io/enforce:
# privileged, with nothing else in it.

image:
  repository: ghcr.io/saremox/hopcorder-agent
  tag: ""                     # default: the chart's appVersion
  # The digest (sha256:...) of the appVersion's image, used while tag is
  # empty: the chart then runs repository:appVersion@digest, whatever the
  # tag names by now. The charts of a release carry their images' digests;
  # empty (a checkout), the tag alone names the image. A tag of your own
  # replaces both (tag: X.Y.Z@sha256:... pins it).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# statefulset: `replicas` agents with stable names; each pod's name is its
#   agent_id and it keeps its spool on its own volume.
# daemonset: one agent per node; the node's name is the agent_id and the
#   spool lives on the node (hostPath).
mode: statefulset
replicas: 1

# Put before every agent_id as it is: eu1- gives eu1-hopcorder-agent-0, or
# eu1-<node name>. Agent IDs must be unique per server: it keeps one
# sequence high-water mark per agent_id, so of two agents with one ID, one
# is refused for good (or its records are dropped as the other's
# duplicates) and their streams are merged. Pod names repeat across
# clusters (each has its hopcorder-agent-0), and node names do too (kind,
# minikube and k3s defaults, cloud nodes named after addresses in the same
# CIDR) whatever the release name: when agents of several clusters ship to
# one server, give each cluster its own prefix. Letters, digits, '.', '_',
# ':' and '-', at most 128 characters with the name: the chart checks the
# pod names, and the agent refuses at start an ID too long with its node's.
# config.agent_id is ignored.
agentIdPrefix: ""

# Trace from the node's network instead of the pod network (no CNI hops in
# the path, and the node's own source address).
hostNetwork: false

# Where records go: the hopcorder server (outputs.http.url).
server:
  url: http://hopcorder-server:8080
  # Credentials for your ingress, from existing Secrets (the chart refuses
  # inline credentials in config, credential-like headers such as
  # Authorization, Cookie or X-Api-Key included: they would land in a
  # ConfigMap). The header check goes by name and is a heuristic: a
  # credential in a header it does not recognise still ends up in the
  # ConfigMap, so send credentials only through these Secrets.
  bearerTokenSecret:
    name: ""
    key: token
  basicAuth:
    username: ""
    passwordSecret:
      name: ""
      key: password
  # TLS towards an https url: a CA to trust instead of the system roots
  # and/or a client certificate (mTLS), from one Secret.
  tls:
    secretName: ""
    caKey: ""                 # e.g. ca.crt
    certKey: ""               # e.g. tls.crt (with keyKey)
    keyKey: ""                # e.g. tls.key
    serverName: ""

# The agent's configuration file (see deploy/agent.example.yaml for every
# key; unknown keys are rejected). The chart sets agent_id (see
# agentIdPrefix), spool.dir, outputs.http (from server) and outputs.metrics
# (from metrics); other outputs.http keys given here are kept.
config:
  interval: 5s
  log:
    level: info
    format: json
  spool:
    max_age: 168h
    # max_bytes bounds the spool file on disk (all of it: the records take
    # half to two thirds). With mode: statefulset it must fit the volume:
    # unset, it is 75% of persistence.size, at most 1GiB (768MiB for the
    # default 1Gi); set, at most 90% of persistence.size, or the chart
    # refuses it (the file system needs the rest). With mode: daemonset,
    # unset, the agent's default (1GiB) on the node's disk.
    # max_bytes: 768MiB
  targets: []                 # required, e.g. [{host: example.net}, {host: 192.0.2.10, protocol: tcp, port: 443}]

metrics:
  enabled: true
  port: 9469
  # With hostNetwork, 0.0.0.0 is every address of the node (NetworkPolicy
  # does not apply to host-network pods). 127.0.0.1 keeps the metrics on the
  # node, without the Service and ServiceMonitor. The endpoint holds at most
  # 64 connections, so whoever can reach it can block scrapes (not the
  # probing): limit it with networkPolicy or, with hostNetwork, the nodes'
  # firewall. The pods have no liveness probe: /metrics answering says
  # nothing about the probing, and a probe on it would let anyone holding
  # those connections have the agent restarted.
  listenAddress: 0.0.0.0
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# A NetworkPolicy admitting inbound connections only to the metrics port and
# only from `from` (NetworkPolicy "from" entries, required when the metrics
# are exposed). Off by default; needs a CNI that enforces NetworkPolicy.
# It does not apply to pods with hostNetwork (the chart refuses the
# combination). Select peers by namespace, which pods cannot fake, e.g.
#   from:
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: monitoring
# Replies to the agent's probes are not new connections and stay allowed;
# that includes the routers' ICMP errors (Time Exceeded) in conntrack-based
# implementations. Not tested in a cluster: check after enabling it that
# hops still answer.
networkPolicy:
  enabled: false
  from: []

# mode: statefulset - the spool volume of each agent. config.spool.max_bytes
# follows it (see there). A StatefulSet's volumes cannot be resized through
# it: a new size applies to new volumes (after deleting the StatefulSet
# with --cascade=orphan, or a new release), so for more spool on existing
# volumes expand the PVCs themselves and set max_bytes.
persistence:
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

# mode: daemonset - the spool directory on each node.
hostPath: /var/lib/hopcorder-agent

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_RAW]

extraArgs: []
