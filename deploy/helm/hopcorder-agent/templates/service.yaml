# Headless: the StatefulSet's governing service, and the metrics endpoints
# of every agent for scraping.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hopcorder-agent.fullname" . }}
  labels:
    {{- include "hopcorder-agent.labels" . | nindent 4 }}
spec:
  clusterIP: None
  {{- if and .Values.metrics.enabled (ne .Values.metrics.listenAddress "127.0.0.1") }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  {{- end }}
  selector:
    {{- include "hopcorder-agent.selectorLabels" . | nindent 4 }}
