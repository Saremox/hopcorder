{{- if eq .Values.mode "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hopcorder-agent.fullname" . }}
  labels:
    {{- include "hopcorder-agent.labels" . | nindent 4 }}
spec:
  # Each replica is its own agent (agent_id = agentIdPrefix + pod name) with
  # its own spool: a stable name keeps its sequence numbers unique and its
  # streams continuous across restarts.
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "hopcorder-agent.fullname" . }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "hopcorder-agent.selectorLabels" . | nindent 6 }}
  template:
    {{- include "hopcorder-agent.podTemplate" . | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
