# Chart smoke test: images built from this commit and loaded into kind.
image:
  repository: hopcorder-server
  tag: ci
  pullPolicy: Never
config:
  enrich:
    rdns:
      enabled: false
    asn:
      enabled: false
persistence:
  enabled: true
  size: 100Mi
# The chart's own single ClickHouse pod, with the read-only user.
clickhouse:
  deploy:
    enabled: true
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    readOnlyUser:
      enabled: true
      # Scaled to the 1Gi above (smoke.sh checks they are in force).
      maxMemoryUsage: 200000000
      maxMemoryUsageForUser: 300000000
