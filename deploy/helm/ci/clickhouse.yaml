# A throwaway single-node ClickHouse for the chart smoke test (CI only; use
# a ClickHouse operator or a managed service in production).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels: {app: clickhouse}
  template:
    metadata:
      labels: {app: clickhouse}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - containerPort: 8123
          readinessProbe:
            httpGet: {path: /ping, port: 8123}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector: {app: clickhouse}
  ports:
    - port: 8123
      targetPort: 8123
