image:
  repository: hopcorder-agent
  tag: ci
  pullPolicy: Never
mode: daemonset
hostNetwork: true
server:
  url: http://hopcorder-server.default.svc:8080
metrics:
  port: 9470          # the StatefulSet agents do not use host ports, but keep clear of 9469 anyway
config:
  interval: 2s
  targets:
    - host: hopcorder-server.default.svc
      protocol: tcp
      port: 8080
